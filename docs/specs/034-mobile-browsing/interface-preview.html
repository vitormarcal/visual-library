<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prévia · Navegar e explorar</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#000;background:#fff}button,input{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;color:inherit}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #435ee5;outline-offset:2px}button{border:0;border-radius:16px;min-width:44px;min-height:44px;padding:10px 14px;background:#f6f6f3}header{position:sticky;top:0;background:#fff;z-index:3;padding:12px 16px;display:flex;gap:8px}input{min-width:0;width:100%;height:48px;padding:0 18px;border:1px solid transparent;border-radius:999px;background:#f6f6f3;font-size:16px}main{max-width:900px;margin:auto;padding:0 16px 112px}h1{font-size:22px;letter-spacing:-.5px;margin:8px 0 0}h2{font-size:18px;margin:20px 0 12px}p{margin:4px 0 8px;color:#62625b;font-size:13px}.title{display:flex;align-items:center;gap:8px}.title div{flex:1;min-width:0}.tabs{display:flex;gap:8px;margin:8px 0}.tabs button{background:transparent;font-size:14px;font-weight:600}.tabs button[aria-current]{text-decoration:underline;text-underline-offset:12px;text-decoration-thickness:2px}.masonry{columns:2;column-gap:8px}.pin{display:inline-block;vertical-align:top;width:100%;padding:0;margin:0 0 8px;background:#f6f6f3;border-radius:16px;overflow:hidden;line-height:0}.pin img{width:100%;height:auto;display:block}.folders{display:grid;grid-template-columns:1fr 1fr;gap:20px 12px}.folder{padding:0;background:transparent;text-align:left;overflow:hidden}.folder img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;border-radius:16px}.folder strong{display:block;margin-top:8px;font-size:16px}.folder span{font-size:12px;color:#62625b}.detailNav{position:sticky;top:72px;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0 8px;z-index:2}.detailNav button{background:#fff;font-size:14px;font-weight:600}.detailImage{position:relative;background:#f6f6f3;border-radius:16px;overflow:hidden}.detailImage img{display:block;width:100%;max-height:58svh;object-fit:contain}.expand{position:absolute;bottom:12px;right:12px;border-radius:999px;background:#fff;font-size:21px}.tagRow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:12px 0}.tagRow button{border-radius:999px;font-size:13px}.tagRow .plain{background:transparent}.detailTools{display:flex;align-items:center;justify-content:space-between}.detailTools span{font-size:12px;color:#62625b}.relatedLabel{margin-top:16px}.caption{font-size:12px;color:#62625b;line-height:1.4;display:block;text-align:left;padding:6px 4px;background:white}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:4;background:#fff;border-top:1px solid #dadad3;display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}.bottom button{min-width:80px;min-height:52px;display:grid;justify-items:center;gap:3px;background:transparent;font-size:12px;padding:4px 12px}.bottom b{font-size:21px;line-height:24px}.bottom [aria-current]{background:#f6f6f3;font-weight:700}.bottom .add{color:#e60023}dialog{border:0;border-radius:32px;width:min(480px,calc(100% - 24px));padding:24px;max-height:90dvh}dialog::backdrop{background:#26262280}dialog h2{margin:0 0 12px}dialog button{display:block;width:100%;margin-top:8px}.full{width:100%;height:100dvh;max-width:none;max-height:none;margin:0;border-radius:0;background:#262622;padding:8px}.full img{width:100%;height:100%;object-fit:contain}.full button{position:absolute;right:16px;top:max(16px,env(safe-area-inset-top));width:44px;padding:0}.hint{font-size:12px;color:#62625b;margin:8px 0 12px}.empty{padding:32px 0}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(min-width:641px){main{max-width:660px}.masonry{columns:3}.detailImage img{max-height:60svh}.bottom{left:calc(50% - 330px);right:calc(50% - 330px)}}@media(max-width:350px){.masonry{columns:1}.folders{grid-template-columns:1fr}.detailNav{flex-wrap:wrap}}
</style>
<header><label class="sr" for="search">Buscar nesta prévia</label><input id="search" type="search" placeholder="Buscar na biblioteca" autocomplete="off"><button id="about" aria-label="Sobre a prévia">ⓘ</button></header>
<main id="content"></main>
<nav class="bottom" aria-label="Navegação principal"><button data-dest="images"><b aria-hidden="true">▦</b>Biblioteca</button><button data-dest="explore"><b aria-hidden="true">◇</b>Explorar</button><button class="add" id="add"><b aria-hidden="true">＋</b>Adicionar</button></nav>
<dialog id="info"><h2>Prévia de composição</h2><p>Ilustrações sintéticas. Experimente abrir uma pasta, uma imagem, uma relacionada e voltar. A busca filtra os nomes de exemplo. Não há acesso ao seu acervo.</p><button onclick="this.closest('dialog').close()">Fechar</button></dialog>
<dialog id="actions"><h2>Mais ações</h2><p>Na aplicação, origem, compartilhamento e visibilidade ficam aqui, mantendo seus comportamentos atuais.</p><button onclick="this.closest('dialog').close()">Fechar</button></dialog>
<dialog id="full" class="full" aria-label="Imagem ampliada"><img alt="Ilustração ampliada"><button aria-label="Fechar ampliação" onclick="this.closest('dialog').close()">×</button></dialog>
<script>
const main=document.querySelector('main'), search=document.querySelector('input');
const colors=[['#d8d5c5','#526a55','#293e37'],['#ded2c5','#b66a48','#633b32'],['#d7dee2','#8496a4','#324b61'],['#e8dcba','#c19b53','#655b35']];
const names=['Serra','Casa de terra','Mar calmo','Sol de inverno','Jardim','Pátio','Horizonte','Dunas','Floresta','Janela','Lago','Campo'];
const images=names.map((name,i)=>{const c=colors[i%4],h=[520,280,410,320][i%4];const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="360" height="${h}" viewBox="0 0 360 ${h}"><path fill="${c[0]}" d="M0 0h360v${h}H0z"/><circle cx="270" cy="78" r="32" fill="#fbfbf9"/><path fill="${c[1]}" d="M0 ${h*.66}Q90 ${h*.22} 180 ${h*.64}T360 ${h*.53}V${h}H0z"/><path fill="${c[2]}" d="M0 ${h*.85}Q140 ${h*.48} 360 ${h*.81}V${h}H0z"/></svg>`;return {id:i,name,h,src:'data:image/svg+xml,'+encodeURIComponent(svg),folder:['Paisagens','Arquitetura','Água','Referências'][i%4]}});
let state={view:'images',query:'',folder:null,image:null}, stack=[],origin=null;
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const snapshot=()=>({state:{...state},scroll:scrollY,focus:document.activeElement?.id});
function restore(s){state={...s.state};render();requestAnimationFrame(()=>{scrollTo(0,s.scroll);document.getElementById(s.focus)?.focus({preventScroll:true})})}
function pin(i,related=false){return `<button class="pin" id="pin-${i.id}" data-image="${i.id}" aria-label="Abrir ${i.name}"><img src="${i.src}" width="360" height="${i.h}" alt="${i.name}">${related?'<span class="caption">Pasta: '+i.folder+'</span>':''}</button>`}
function render(){search.value=state.query;search.placeholder=state.view==='folders'?'Buscar pastas':state.folder?'Buscar em '+state.folder:'Buscar na biblioteca';document.querySelectorAll('[data-dest]').forEach(b=>{b.removeAttribute('aria-current');if(b.dataset.dest===(state.view==='explore'?'explore':'images'))b.setAttribute('aria-current','page')});
 if(state.image!==null){const i=images[state.image];main.innerHTML=`<div class="detailNav"><button id="return-origin">← ${origin?.state.folder?'Voltar à pasta':origin?.state.view==='explore'?'Voltar à exploração':'Voltar à biblioteca'}</button>${stack.length?'<button id="previous-view">← Imagem anterior</button>':''}</div><div class="detailImage"><img src="${i.src}" width="360" height="${i.h}" alt="${i.name}"><button class="expand" id="expand" aria-label="Ampliar imagem">⛶</button></div><div class="tagRow"><button data-folder="${i.folder}">${i.folder}</button><button class="plain" id="edit">Editar tags</button></div><div class="detailTools"><span>${i.name}</span><button id="more" aria-label="Mais ações da imagem">•••</button></div><h2 class="relatedLabel">Mais da sua biblioteca</h2><div class="masonry">${images.filter(x=>x.id!==i.id).sort((a,b)=>Number(b.folder===i.folder)-Number(a.folder===i.folder)).map(x=>pin(x,true)).join('')}</div>`;
 document.querySelector('#return-origin').onclick=()=>{stack=[];restore(origin)};document.querySelector('#previous-view')?.addEventListener('click',()=>restore(stack.pop()));document.querySelector('#expand').onclick=()=>{document.querySelector('#full img').src=i.src;document.querySelector('#full').showModal()};document.querySelector('#more').onclick=()=>document.querySelector('#actions').showModal();document.querySelector('#edit').onclick=()=>{document.querySelector('#actions h2').textContent='Editar tags';document.querySelector('#actions p').textContent='A edição existente será preservada. Esta prévia demonstra apenas a composição.';document.querySelector('#actions').showModal()};
 }else{let title=state.folder||({images:'Biblioteca',folders:'Biblioteca',explore:'Explorar'}[state.view]);main.innerHTML=`<div class="title">${state.folder?'<button id="folders-back" aria-label="Voltar às pastas">←</button>':''}<div><h1>${esc(title)}</h1><p>${state.view==='folders'?'4 pastas':state.view==='explore'?'Uma seleção do seu acervo':state.folder?'3 imagens':'12 imagens'}</p></div></div>${!state.folder&&state.view!=='explore'?`<nav class="tabs" aria-label="Vistas da biblioteca"><button data-view="images" ${state.view==='images'?'aria-current="page"':''}>Imagens</button><button data-view="folders" ${state.view==='folders'?'aria-current="page"':''}>Pastas</button></nav>`:''}`;
 if(state.view==='folders'){main.innerHTML+='<div class="folders">'+colors.map((_,j)=>images[j]).filter(i=>i.folder.toLowerCase().includes(state.query.toLowerCase())).map(i=>`<button class="folder" id="folder-${i.id}" data-folder="${i.folder}"><img src="${i.src}" alt=""><strong>${i.folder}</strong><span>3 imagens</span></button>`).join('')+'</div>'}else{const list=images.filter(i=>(!state.folder||i.folder===state.folder)&&i.name.toLowerCase().includes(state.query.toLowerCase()));main.innerHTML+=list.length?'<div class="masonry">'+list.map(i=>pin(i)).join('')+'</div>':'<p class="empty">Nenhuma imagem encontrada.</p>'}document.querySelector('#folders-back')?.addEventListener('click',()=>{state={view:'folders',folder:null,image:null,query:''};render()})}
 main.querySelectorAll('[data-image]').forEach(b=>b.onclick=()=>{if(state.image===null){origin=snapshot();stack=[]}else stack.push(snapshot());state.image=Number(b.dataset.image);render();scrollTo(0,0);document.querySelector('#return-origin').focus({preventScroll:true})});main.querySelectorAll('[data-folder]').forEach(b=>b.onclick=()=>{state={view:'images',query:'',folder:b.dataset.folder,image:null};stack=[];render();scrollTo(0,0)});main.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;state.query='';render()});}
search.oninput=()=>{state.query=search.value;state.image=null;render()};document.querySelectorAll('[data-dest]').forEach(b=>b.onclick=()=>{if(state.image!==null&&origin?.state.view===b.dataset.dest){stack=[];restore(origin);return}state={view:b.dataset.dest,query:'',folder:null,image:null};render();scrollTo(0,0)});document.querySelector('#about').onclick=()=>document.querySelector('#info').showModal();document.querySelector('#add').onclick=()=>document.querySelector('#info').showModal();document.querySelector('#actions').addEventListener('close',()=>{document.querySelector('#actions h2').textContent='Mais ações';document.querySelector('#actions p').textContent='Na aplicação, origem, compartilhamento e visibilidade ficam aqui, mantendo seus comportamentos atuais.'});render();
</script>
</html>
